services:
  db-test:
    image: postgres:15
    container_name: wishlist-db-test
    env_file:
      - ./server/.env.test
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - db-data-test:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:${DB_CONTAINER_PORT}"
    networks:
      - wishlist-server-testing-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}", "-d", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  db-migrate:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    environment:
      DB_HOST: db-test
      DB_PORT: ${DB_CONTAINER_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    command: npm run db:prepare
    depends_on:
      db-test:
        condition: service_healthy
    networks:
      - wishlist-server-testing-network

networks:
  wishlist-server-testing-network:
    driver: bridge

volumes:
  db-data-test:
